problem_text_pl: >
  Jestem psychologiem szkolnym. W ostatnim roku w szkołach naszego powiatu
  było kilka prób samobójczych wśród uczniów, a na wizytę w poradni
  psychologiczno-pedagogicznej czeka się miesiącami. Nauczyciele nie wiedzą,
  jak rozpoznać, że z uczniem dzieje się coś złego, ani jak z nim
  rozmawiać. Chcemy działać zapobiegawczo, zanim dojdzie do kolejnych prób.
