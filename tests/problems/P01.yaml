notes: >-
  The text of the example in 13.1, shown on slide 3 of the deck (Laskowa).
  Expected are low-cost models a gmina can run in a free room for lonely
  seniors who stay at home: inn-nat-649 (derived.problem_pl: older people
  excluded from social activity; mechanism_pl: workshops run by pupils),
  inn-nat-teatr-przy-stole (problem_pl: isolation, and social centres lack
  simple activities for seniors), inn-rops-senior-cuder (mechanism_pl: a card
  game for senior clubs), inn-nat-sztafeta-pokolen-2 (problem_pl: seniors who
  can hardly leave home; volunteers visit them) and inn-nat-aplikobus-3
  (problem_pl: dependent seniors cannot go out, which isolates them). Wrong
  answers: inn-nat-animator-wiezi-2 (a role in long-term care homes) and the
  care after a hospital stay of
  inn-rops-organizator-kompleksowej-opieki-w-miejscu-zamieszkania, which the
  text does not mention. Paths: the selector of 8.7 for jst picks
  asy-priorytet-v (a senior club), korpus-wsparcia-seniorow and
  cus-program-uslug. None of the expected innovations runs within 50 km of
  Laskowa, so only the advisor is expected among the people.
