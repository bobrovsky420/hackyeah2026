problem_text_pl: >
  Zgłaszam sprawę z naszej gminy. Mamy kilku mężczyzn, którzy od lat nie
  mają własnego kąta: jeden nocuje w budynku gospodarczym u kuzyna, inny w
  opuszczonym domu przy drodze. Nie mają gdzie się umyć ani wyprać ubrań.
