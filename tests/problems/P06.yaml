id: P06
title: Dzieci w spektrum autyzmu na badaniach i u dentysty
author: ai-assistant
written_on: 2026-10-03
role: organizacja-spoleczna
place_terc: "1261011"
problem_text_pl: >
  Nasze stowarzyszenie skupia rodziców dzieci i nastolatków w spektrum
  autyzmu. Najtrudniejsze są dla nas zwykłe wizyty zdrowotne: pobranie
  krwi, szczepienie, przegląd zębów. Dziecko wpada w panikę na widok
  fartucha, krzyczy albo ucieka, a pielęgniarki i lekarze nie mają czasu ani
  pomysłu, jak je uspokoić. Kilka rodzin od lat nie robi dzieciom żadnych
  badań, bo każda próba kończy się płaczem i odesłaniem do domu.
