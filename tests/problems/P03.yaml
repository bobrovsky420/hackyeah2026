problem_text_pl: >
  Jestem pedagogiem szkolnym w technikum. Od początku roku troje uczniów
  wróciło do klasy po pobycie na dziennym oddziale psychiatrii dla
  młodzieży. Wychowawcy pytają mnie, co mają powiedzieć klasie, a czego
  lepiej nie mówić. Jeden z chłopców po dwóch tygodniach znowu przestał
  przychodzić, bo czuł, że wszyscy się na niego patrzą. Rodzice też są
  zagubieni i nie wiedzą, jak rozmawiać ze szkołą.
