# Banned words in generated text (specification FR-12.10, E1 of 3.6, 11 rule 6
# and 13.2). src/server/route/safety.ts checks every text a model writes for
# the reader (the need summary that titles the route, from the gate and from
# stage 1; the route's summary, next steps and "Dlaczego ta ścieżka"; the
# brief; the names of need clusters) against this list; a text with a hit is
# dropped and replaced by its template of messages/pl.json, and the stage log
# names the category, never the text. The evaluation harness runs the same
# check on every generated string. Hand-written, committed to git.
#
# This list is about our words, never about the user's. It is never applied
# to what a person types: people say "alkoholik", "kaleka" or "żule pod
# sklepem" in everyday speech, and such a word alone never declines,
# redirects or slows down a request. The
# gate judges the purpose of a text (prompts/screen.md), and the models
# restate the need in people-first words.
#
# Polish plurals of persons change the stem ("alkoholik", "alkoholicy";
# "pijak", "pijacy"; "wariat", "wariaci"), so a prefix does not cover them:
# list the plural forms too.
#
# Syntax of an entry: one or more words separated by spaces; each word must
# match one word of the text, in order and next to each other, compared in
# lower case. A word ending in * matches every word that starts with it
# (all inflected forms); a word without * matches only that exact form. Use
# the * only where no ordinary word starts the same way (for example not
# "żul*", which would also match "Żuławy"; list the forms instead).
#
# The list is a draft: the lawyer reviews and completes it (FR-12.10). It
# errs on the side of dropping model text, because a dropped text only
# costs a templated sentence.
#
# For the lawyer's review (open points of this draft):
#   1. Proper names are caught too: "Anonimowi Alkoholicy", "Szpital dla
#      Nerwowo i Psychicznie Chorych" in Rybnik (a catalogue organisation).
#      A model sentence naming them becomes its template; the names still
#      show where the app prints them from the data. Accept, or ask for an
#      allowed-names list.
#   2. "przedawkowa*" also drops "zapobieganie przedawkowaniom", a harm
#      reduction topic of addiction routes; narrow it to method phrases?
#   3. "dysfunkcyjn*" and "patologiczn*" are everyday social-work jargon
#      ("rodzina dysfunkcyjna", "hazard patologiczny"); kept, because the
#      people-first form costs nothing in our own text.
owner: "the team's lawyer"
status: "szkic przygotowany przez asystenta AI, do przeglądu"
date: "2026-10-03"
reviewer: null

