  - id: kn-abc-diagnozy
    title_pl: "ABC Diagnozy. Badanie podaży i popytu na usługi społeczne w gminie"
    description_pl: Praktyczny przewodnik, jak przeprowadzić diagnozę potrzeb i zasobów usług społecznych w gminie, z uwzględnieniem podmiotów ekonomii społecznej.
    url: https://rops.krakow.pl/mpliki/MACIUS/ABC_Diagnozy_final.pdf
    type: guide
    target_groups: [any]
    always_show: true
    source_url: https://rops.krakow.pl/mpliki/MACIUS/ABC_Diagnozy_final.pdf
    verified_on: "2026-10-03"

