# Fixed content of the route's knowledge block ("Wiedza"; specification
# FR-4.3, 7.4, 8.4 and 14.3). Hand-written reference data, committed to git.
# The materials of each solution come from its innovation record; this file
# holds the links that do not belong to one innovation.
#
# Rules for the route composer:
# - items with always_show: true go on every route (the ROPS guide to a local
#   needs diagnosis, "ABC Diagnozy");
# - model_by_target_group names, per target-group code of data/taxonomies.json,
#   the regional service model or the page that fits; the composer adds those
#   items when the route's target group matches (FR-4.3);
# - target_groups on an item lists the codes it fits, or [any].
#
# type: guide, model, publication, catalogue, data, contact, project.
# Titles and URLs were confirmed against the copies in .local/docs/rops/
# and every url was checked live. source_url is the page that lists the item. The observatory
# IOSS is linked, never scraped (specification 8.8).
version: "2026-10-03"
verified_on: "2026-10-03"

model_by_target_group:
  seniorzy: [kn-model-dzienna-opieka, kn-model-centra-opiekunow, kn-innowacje-w-modelach]
  dzieci-mlodziez-rodziny: [kn-model-wsparcie-dzienne-dzieci]
  ograniczona-mobilnosc: [kn-model-dzienna-opieka, kn-model-centra-opiekunow, kn-standardy-mieszkan]
  niepelnosprawnosc-sensoryczna: [kn-model-centra-opiekunow, kn-standardy-mieszkan]
  niepelnosprawnosc-intelektualna: [kn-model-centra-opiekunow, kn-standardy-mieszkan]
  spektrum-autyzmu: [kn-model-centra-opiekunow, kn-standardy-mieszkan]
  zdrowie: [kn-biblioteka-zdrowie]
  rynek-pracy: [kn-biblioteka-rynek-pracy]
  cudzoziemcy: [kn-biblioteka-cudzoziemcy]
  bezdomnosc: [kn-biblioteka-bezdomnosc]
  inne: [kn-modele-uslug-spolecznych]

items:
