notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Ścieżka dotyczy samorządów, organizacji i instytucji publicznych z powiatów przygranicznych. Kwoty podano w euro, bez przeliczenia na złote. Dane pochodzą częściowo ze źródła pośredniego."
