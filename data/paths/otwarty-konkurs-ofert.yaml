reviewer: null
notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Ofertę mogą złożyć organizacje pozarządowe i podmioty wymienione w art. 3 ust. 3 ustawy. Kwoty i terminy każdego konkursu podaje jego ogłoszenie."
