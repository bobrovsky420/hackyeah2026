amount_min_pln: null
amount_max_pln: null
amount_note_pl: "Kwotę podaje ogłoszenie każdego konkursu. Zasady wkładu rzeczowego opisuje art. 5 ust. 4a i 4b ustawy."
timing:
  kind: per-call
  note_pl: "Na złożenie ofert jest co najmniej 21 dni od ogłoszenia konkursu. Konkursy wynikają z rocznego programu współpracy, który samorząd uchwala do 30 listopada."
  calls: []
decision_maker_pl: "Wójt, burmistrz, prezydent miasta albo zarząd powiatu lub województwa, po opinii komisji konkursowej"
steps_pl:
  - "Sprawdź roczny program współpracy i ogłoszenia konkursów w urzędzie."
  - "Przygotuj ofertę zgodnie z warunkami ogłoszenia konkursu."
  - "Złóż ofertę w terminie podanym w ogłoszeniu."
fit:
