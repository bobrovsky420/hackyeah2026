id: otwarty-konkurs-ofert
name_pl: "Otwarty konkurs ofert"
legal_basis_pl: "art. 11 ust. 2 i art. 13-15 ustawy z dnia 24 kwietnia 2003 r. o działalności pożytku publicznego i o wolontariacie, t.j. Dz.U. 2025 poz. 1338, zm. Dz.U. 2026 poz. 1040"
applicant_types: [ngo]
