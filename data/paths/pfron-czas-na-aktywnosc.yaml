notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Konkurs jest dla organizacji, które co najmniej 12 miesięcy działają na rzecz osób z niepełnosprawnościami."
