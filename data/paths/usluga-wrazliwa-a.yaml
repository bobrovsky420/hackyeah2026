notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Wniosek mogą złożyć samorządy i ich jednostki, na przykład ośrodki pomocy społecznej, centra usług społecznych i powiatowe centra pomocy rodzinie, a także organizacje pozarządowe i podmioty ekonomii społecznej z Małopolski z co najmniej 3-letnim doświadczeniem. Nie wiadomo, czy będzie III nabór."
