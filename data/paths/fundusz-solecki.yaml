id: fundusz-solecki
name_pl: "Fundusz sołecki"
legal_basis_pl: "ustawa z dnia 21 lutego 2014 r. o funduszu sołeckim, Dz.U. 2014 poz. 301, zm. ustawą z dnia 12 września 2025 r., Dz.U. 2025 poz. 1436, w brzmieniu obowiązującym od 1 stycznia 2026 r."
applicant_types: [mieszkancy]
decides: jst
purposes: [inicjatywa-mieszkancow]
target_groups: [any]
scope: lokalna
amount_min_pln: null
amount_max_pln: null
amount_note_pl: "Kwotę dla sołectwa liczy się ze wzoru F = (2 + Lm/100) x Kb, najwyżej 10 x Kb, gdzie Lm to liczba mieszkańców sołectwa, a Kb to kwota bazowa. Przedsięwzięcia muszą być zadaniami własnymi gminy."
timing:
  kind: annual
  note_pl: "Rada gminy decyduje o wyodrębnieniu funduszu do 31 marca. Wójt podaje kwoty do 31 lipca. Sołectwo składa wniosek do wójta do 30 września."
  calls:
    - label_pl: "Wniosek sołectwa do wójta"
      applicant_types: [mieszkancy]
      opens_on: null
      closes_on: "2026-09-30"
decision_maker_pl: "Zebranie wiejskie uchwala wniosek, wójt go sprawdza, a w sporze rozstrzyga rada gminy"
steps_pl:
  - "Zbierz 15 pełnoletnich mieszkańców, aby zwołać zebranie wiejskie."
  - "Przedstaw na zebraniu wiejskim swój pomysł i jego koszt."
  - "Dopilnuj, aby wniosek trafił do wójta do 30 września."
fit:
  cost_bands: [low, medium, high, unknown]
  roles: [mieszkaniec]
  boost_when_implementer_types: [osoba]
source_url: "https://api.sejm.gov.pl/eli/acts/DU/2025/1436/text.pdf"
verified_on: "2026-10-03"
reviewer: null
notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Zebranie wiejskie zwołuje się z inicjatywy sołtysa, rady sołeckiej albo 15 pełnoletnich mieszkańców. Od 2026 r. obowiązują nowe zasady odwołań z terminami 7 i 14 dni, a rada gminy rozstrzyga w ciągu 30 dni. Stawki zwrotu części wydatków z budżetu państwa nie zostały sprawdzone."
