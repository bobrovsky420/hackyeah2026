notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Zgłaszać się mogą osoby, grupy nieformalne, organizacje pozarządowe, samorządy, firmy i podmioty ekonomii społecznej z całej Polski. INNOAGH wspomina o drugim cyklu w latach 2025-2026, ale tego nie potwierdzono. Wynik wyszukiwania podaje nabór od 27 kwietnia do 8 czerwca 2026 r. z kwotą do 100 000 zł, czego również nie potwierdzono."
