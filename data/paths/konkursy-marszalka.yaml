notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Dane o konkursach pochodzą częściowo ze źródła pośredniego. Kwoty i terminy na 2027 r. nie są jeszcze znane."
