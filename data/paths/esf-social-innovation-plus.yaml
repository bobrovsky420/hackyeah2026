notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Polska gmina lub organizacja może wziąć udział tylko jako współwnioskodawca. Koordynatorem musi być organ publiczny, a w projekcie muszą być co najmniej 2 podmioty z 2 państw członkowskich. Kwoty podano w euro, bez przeliczenia na złote."
