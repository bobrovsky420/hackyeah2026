notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Wniosek składają mieszkańcy swojej gminy bezpośrednio albo przez organizację. Dane dla Krakowa pochodzą ze źródła pośredniego. Progi w Krakowie, 60 punktów i 8 tygodni, nie zostały potwierdzone."
