id: inicjatywa-lokalna
name_pl: "Inicjatywa lokalna"
legal_basis_pl: "art. 19b-19h ustawy z dnia 24 kwietnia 2003 r. o działalności pożytku publicznego i o wolontariacie, t.j. Dz.U. 2025 poz. 1338, zm. Dz.U. 2026 poz. 1040"
applicant_types: [mieszkancy, ngo]
