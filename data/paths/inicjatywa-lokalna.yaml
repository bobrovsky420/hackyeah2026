scope: lokalna
amount_min_pln: null
amount_max_pln: null
amount_note_pl: "Mieszkańcy wnoszą wkład pracą społeczną, pieniędzmi lub rzeczami. Dziedziny, w których można złożyć wniosek, wymienia art. 19b ustawy. W Krakowie pula na 2026 r. wynosi 275 000 zł."
timing:
  kind: rolling
  note_pl: "Tryb i kryteria określa uchwała rady gminy. Wniosek jest wnioskiem w rozumieniu Kodeksu postępowania administracyjnego. W Krakowie wnioski przyjmowane są w sposób ciągły."
  calls: []
decision_maker_pl: "Wójt, burmistrz lub prezydent miasta, oceniając celowość inicjatywy"
steps_pl:
  - "Sprawdź uchwałę rady gminy o trybie inicjatywy lokalnej."
  - "Zbierz mieszkańców gotowych wnieść pracę, pieniądze lub rzeczy."
  - "Złóż wniosek o realizację inicjatywy w urzędzie gminy."
fit:
