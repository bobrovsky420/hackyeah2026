id: maly-grant-19a
name_pl: "Mały grant, tryb uproszczony z art. 19a"
legal_basis_pl: "art. 19a ustawy z dnia 24 kwietnia 2003 r. o działalności pożytku publicznego i o wolontariacie, t.j. Dz.U. 2025 poz. 1338, zm. Dz.U. 2026 poz. 1040"
applicant_types: [ngo]
decides: jst
purposes: [zadanie-publiczne]
target_groups: [any]
scope: lokalna
amount_min_pln: 0
amount_max_pln: 20000
amount_note_pl: "Do 20 000 zł na jedno zadanie i łącznie do 40 000 zł w roku od jednej jednostki samorządu terytorialnego dla jednej organizacji. Limity obowiązują od 1 września 2026 r., wcześniej wynosiły 10 000 zł i 20 000 zł. Samorząd może przeznaczyć w tym trybie do 30 % swoich dotacji dla organizacji."
timing:
  kind: rolling
  note_pl: "W dowolnym momencie. Urząd publikuje ofertę na 7 dni i każdy może zgłosić uwagi. Zadanie nie musi już zmieścić się w 90 dniach."
  calls: []
decision_maker_pl: "Wójt, burmistrz, prezydent miasta albo zarząd powiatu lub województwa, uznając celowość zadania"
steps_pl:
  - "Przygotuj ofertę na obowiązującym wzorze z opisem zadania i kosztów."
  - "Złóż ofertę w urzędzie gminy, starostwie lub urzędzie marszałkowskim."
  - "Po 7 dniach publikacji i rozpatrzeniu uwag podpisz umowę z urzędem."
fit:
  cost_bands: [low]
  roles: [organizacja-spoleczna]
  boost_when_implementer_types: [ngo]
source_url: "https://eli.gov.pl/eli/DU/2026/1040/ogl/pol"
verified_on: "2026-10-03"
reviewer: null
notes_pl: "Prototyp z hackathonu HackYeah 2026: treści pochodzą z publicznych katalogów innowacji społecznych na licencjach podanych przy wpisie i nie były weryfikowane prawnie. Sprawdź źródło przed użyciem. Sprawdź u źródła. Część urzędów, w tym Kraków w komunikacie z maja 2026 r., nadal podaje stary limit 10 000 zł. Sprawdź aktualny komunikat urzędu. Ofertę mogą złożyć organizacje pozarządowe i podmioty wymienione w art. 3 ust. 3 ustawy."
