mentors:
  - id: MT01
    name: Ekspertka ds. wsparcia rodzin z dziećmi
    expertise_pl: >-
      Asystentura rodziny, świetlice środowiskowe i wsparcie rodziców w
      kryzysie, także w małych gminach wiejskich.
    target_groups: [dzieci-mlodziez-rodziny]
  - id: MT02
    name: Ekspert ds. dostępności i niepełnosprawności
    expertise_pl: >-
      Dostępność budynków i usług, mieszkania treningowe, asystencja
      osobista i zatrudnienie wspomagane osób z niepełnosprawnościami.
    target_groups:
      - ograniczona-mobilnosc
      - niepelnosprawnosc-sensoryczna
      - niepelnosprawnosc-intelektualna
      - spektrum-autyzmu
  - id: MT03
    name: Ekspertka ds. integracji cudzoziemców
    expertise_pl: >-
      Wsparcie rodzin cudzoziemców w szkole i w urzędzie, nauka języka
      polskiego i pierwsze kroki na rynku pracy.
    target_groups: [cudzoziemcy, dzieci-mlodziez-rodziny]

posts:
  - id: PP01
    kind: szukam
    sector: ngo
    seeking: [biznes]
    target_groups: [seniorzy]
    author:
      display_name: Dariusz S.
      organisation: Fundacja wsparcia seniorów
    title: Szukamy firmy, która odda używane laptopy
    description: >-
      Prowadzimy kursy komputerowe dla seniorów w trzech klubach i brakuje
      nam sprzętu. Szukamy firmy, która wymienia komputery i może przekazać
      starsze laptopy. Sami je przygotujemy i wystawimy potwierdzenie
      darowizny.
  - id: PP02
    kind: oferuje
    sector: biznes
    seeking: [ngo, instytucja]
    target_groups: [rynek-pracy, niepelnosprawnosc-intelektualna]
    author:
      display_name: Krzysztof B.
      organisation: Piekarnia rodzinna
    title: Praktyki w piekarni dla osób z niepełnosprawnością
    description: >-
      Prowadzimy rodzinną piekarnię i możemy przyjąć na praktyki dwie osoby
      z niepełnosprawnością intelektualną. Szukamy partnera, który zapewni
      trenera pracy na pierwsze tygodnie. Jedna taka osoba pracuje u nas od
