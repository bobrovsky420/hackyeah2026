moderation_reasons_pl:
  - Treść zawiera dane osobowe osoby trzeciej.
  - Treść zawiera dane o zdrowiu, które mogą wskazać konkretną osobę.
  - Wpis nie dotyczy innowacji społecznych ani potrzeb mieszkańców.
  - Treść ma charakter reklamowy.
  - Treść zawiera sformułowania obraźliwe wobec innych osób.
  - Opis jest zbyt ogólny, prosimy dopisać, komu i w czym ma pomóc pomysł.
  - Wpis powtarza fiszkę, którą ta sama osoba wysłała wcześniej.
  - Nie udało się potwierdzić, że organizacja działa i zgodziła się na wpis.
  - Ogłoszenie dotyczy sprzedaży usług, a nie partnerstwa.
  - Wpis wstrzymany do wyjaśnienia, czy opisana praktyka nadal działa.

notes_pl:
  - Przekazano opiekunowi kategorii seniorzy, odpowiedź do piątku.
  - Zadzwonić do autorki, czy zgadza się na opis w bazie dobrych praktyk.
  - Podobna fiszka z sąsiedniej gminy, warto połączyć autorów.
  - Kandydat do naboru inkubatora, omówić na zebraniu działu.
  - Sprawdzić u koordynatora, czy innowacja nadal działa.
  - Autor prosi o rozmowę telefoniczną po południu.
  - Usunięto z opisu nazwisko osoby trzeciej przed publikacją.
  - Czekamy na odpowiedź eksperta, przypomnieć w poniedziałek.
  - Zgłoszenie spoza województwa, odpisano z informacją, gdzie szukać pomocy.
  - Organizacja sprawdzona w rejestrze, wpis zweryfikowany.
  - Ogłoszenie zatwierdzone po skróceniu opisu, autor poinformowany.
  - Pilne, osoba w kryzysie bezdomności przed mrozami, przekazano do OPS.

