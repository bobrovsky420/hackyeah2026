    reply_pl: null
  - id: PM08
    kind: pomysl
    stage: pomysl
    target_groups: [bezdomnosc]
    author:
      display_name: Tomasz R.
      is_organisation: false
    title: Szafka z rzeczami pierwszej potrzeby
    description: >-
      Przy dworcu codziennie widzę te same osoby w kryzysie bezdomności.
