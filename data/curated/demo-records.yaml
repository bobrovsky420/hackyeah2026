    description: >-
      Raz w tygodniu prowadzimy dyżur, na który cudzoziemcy mogą przynieść
      umowę o pracę i zapytać, co podpisują. Dyżuruje wolontariusz, który
      mówi po ukraińsku i po polsku, a trudniejsze sprawy konsultuje z
      prawnikiem. Sprawdzamy, czy da się to robić także przez telefon.
    essence: Cudzoziemiec rozumie umowę, zanim ją podpisze.
    for_whom: >-
      Osoby z Ukrainy i innych krajów, które zaczynają pracę w Polsce.
    reply_pl: null
  - id: PM23
    kind: pomysl
    stage: pomysl
    target_groups: [zdrowie, dzieci-mlodziez-rodziny]
    author:
      display_name: Monika J.
      is_organisation: false
    title: Zajęcia o stresie dla nastolatków
    description: >-
      Dzieci w klasie mojego syna są ostatnio bardzo nerwowe i zamknięte. Do
      psychologa czeka się miesiącami. Może psycholog z poradni mógłby raz w
      miesiącu prowadzić w szkole otwarte zajęcia o radzeniu sobie ze
      stresem.
    essence: >-
      Wsparcie psychiczne przychodzi do szkoły, zanim problem urośnie.
    for_whom: Nastolatki i ich rodzice.
    reply_pl: null
  - id: PM24
    kind: dobra-praktyka
    stage: dziala
    target_groups: [bezdomnosc, rynek-pracy]
    author:
      display_name: Stowarzyszenie pomocy osobom w kryzysie bezdomności
      is_organisation: true
    title: Praca przy zieleni dla mieszkańców noclegowni
    description: >-
      Kilka osób z naszej noclegowni pracuje sezonowo przy porządkowaniu
      zieleni w gminie, na umowę z zakładem komunalnym. Dostają
      wynagrodzenie i wsparcie opiekuna, który pomaga, gdy pojawiają się
      problemy. Dwie osoby dostały potem stałą pracę.
    essence: Praca z opiekunem jako pierwszy krok do wyjścia z bezdomności.
    for_whom: Mieszkańcy noclegowni, którzy chcą wrócić do pracy.
    reply_pl: >-
      Dziękujemy za opis. Takiej praktyki szukają inne gminy, prosimy o
      zgodę na pokazanie jej w bazie dobrych praktyk.
  - id: PM25
    kind: pomysl
    stage: test
    target_groups: [seniorzy]
    author:
      display_name: Klub Seniora przy świetlicy wiejskiej
      is_organisation: true
    title: Jak nie dać się oszukać przez telefon
    description: >-
      Kilka osób z naszego klubu straciło oszczędności przez fałszywego
      wnuczka albo fałszywego policjanta. Razem z dzielnicowym prowadzimy
      krótkie spotkania, na których w parach ćwiczymy, co powiedzieć i do
      kogo zadzwonić. Testujemy, czy scenki działają lepiej niż ulotki.
    essence: Ćwiczenie rozmowy z oszustem, zanim zadzwoni naprawdę.
    for_whom: >-
      Seniorzy, którzy mieszkają sami i odbierają telefony od obcych.
    reply_pl: null
  - id: PM26
    kind: pomysl
    stage: pomysl
    target_groups: [spektrum-autyzmu, zdrowie]
    author:
      display_name: Ewa N.
      is_organisation: false
    title: Karta dziecka w spektrum na wizytę u lekarza
    description: >-
      Mój syn ma autyzm. Każda wizyta u lekarza albo dentysty to wielki
      stres, bo nikt nie wie, że trzeba mówić spokojnie i uprzedzać, co się
      stanie. Chciałabym prostą kartę, którą pokazuję w rejestracji, żeby
      personel wiedział, jak się zachować.
    essence: >-
      Personel od razu wie, jak pomóc dziecku w spektrum przejść przez
      wizytę.
    for_whom: >-
      Dzieci w spektrum autyzmu i rodzice, którzy chodzą z nimi do lekarza.
    reply_pl: >-
      Dziękujemy. Podobne rozwiązania pokazujemy na stronie trasy.
      Proponujemy rozmowę o tym, z jaką przychodnią można to sprawdzić w
      małej skali.
  - id: PM27
    kind: pomysl
    stage: prototyp
    target_groups: [dzieci-mlodziez-rodziny, seniorzy]
    author:
      display_name: Szkoła Podstawowa
      is_organisation: true
    title: Ogródek szkolny dla całej wsi
    description: >-
      Za szkołą był kawałek ziemi, który stał pusty. Z uczniami i rodzicami
      założyliśmy grządki, a w wakacje podlewają je seniorzy z sąsiedztwa i
      biorą część warzyw. Pierwszy sezon pokazał, że chętnych jest więcej
      niż miejsca.
    essence: Wspólny ogród, który łączy szkołę z sąsiadami.
    for_whom: Uczniowie, ich rodziny i starsi sąsiedzi szkoły.
    reply_pl: null
  - id: PM28
    kind: dobra-praktyka
    stage: test
    target_groups: [niepelnosprawnosc-intelektualna]
    author:
      display_name: Warsztat Terapii Zajęciowej
      is_organisation: true
    title: Uczestnicy sprawdzają pisma urzędu
    description: >-
      Nasi uczestnicy pomagają urzędowi gminy sprawdzać, czy pisma i
      ogłoszenia są zrozumiałe. Czytają je i mówią, co jest trudne, a
      urzędnicy przepisują je prostym językiem. Sprawdziliśmy już kilka
      druków.
    essence: >-
      Osoby z niepełnosprawnością intelektualną jako testerzy prostego
      języka.
    for_whom: >-
      Osoby z niepełnosprawnością intelektualną i wszyscy, którym urzędowe
      pisma sprawiają kłopot.
    reply_pl: >-
      Dziękujemy za fiszkę. Chętnie pokażemy tę praktykę innym urzędom,
      zapraszamy na konsultację w sprawie opisu i kosztów.
  - id: PM29
    kind: pomysl
    stage: pomysl
    target_groups: [rynek-pracy, dzieci-mlodziez-rodziny]
    author:
      display_name: Spółdzielnia socjalna
      is_organisation: true
    title: Obiady dla szkół z produktów od rolników
    description: >-
      Jesteśmy małą spółdzielnią socjalną i zatrudniamy osoby, które długo
      były bez pracy. Chcemy gotować obiady dla dwóch szkół z produktów od
      okolicznych rolników. Potrzebujemy pomocy w przygotowaniu oferty do
      zamówienia gminy.
    essence: Praca dla osób wykluczonych i zdrowe obiady dla dzieci.
    for_whom: >-
      Osoby długo bez pracy, które chcą wrócić na rynek, i uczniowie szkół
      w gminie.
    reply_pl: >-
      Dziękujemy. Warto zapytać gminę o klauzule społeczne w zamówieniach.
      Ekspert ds. ekonomii społecznej może pomóc w przygotowaniu oferty,
      zapraszamy na konsultację.
  - id: PM30
    kind: pomysl
    stage: pomysl
    target_groups: [ograniczona-mobilnosc, zdrowie]
    author:
      display_name: Krzysztof W.
      is_organisation: false
    title: Wypożyczalnia sprzętu rehabilitacyjnego
    description: >-
      Po wypadku przez kilka miesięcy potrzebowałem wózka i kul, a nowy
      sprzęt jest drogi. Potem taki sprzęt leży w piwnicach. Gmina albo
      parafia mogłaby prowadzić wypożyczalnię, do której ludzie oddają
      sprzęt i z której go biorą.
    essence: Sprzęt krąży między ludźmi, którzy akurat go potrzebują.
    for_whom: Osoby po wypadkach i operacjach oraz ich rodziny.
    reply_pl: null
  - id: PM31
    kind: pomysl
    stage: prototyp
    target_groups: [seniorzy]
    author:
      display_name: Ośrodek Pomocy Społecznej
      is_organisation: true
    title: Obiady z dowozem z gospody
    description: >-
      Nie mamy w gminie stołówki dla seniorów. Dogadaliśmy się z miejscową
      gospodą, która gotuje kilkanaście obiadów więcej, a kierowca gminnego
      busa rozwozi je w porze obiadowej. Na razie dla dziesięciu osób, przez
      kilka miesięcy sprawdzamy koszty.
    essence: Ciepły posiłek dla seniora bez budowania stołówki.
    for_whom: Samotni seniorzy, którzy już sami nie gotują.
    reply_pl: null
  - id: PM32
    kind: pomysl
    stage: pomysl
    target_groups: [inne]
    author:
      display_name: Michał S.
      is_organisation: false
    title: Lodówka społeczna przy sklepie
    description: >-
      W osiedlowym sklepie codziennie zostaje pieczywo i nabiał z krótką
      datą. Obok można postawić lodówkę, do której sklep i sąsiedzi wkładają
      jedzenie, a każdy może coś wziąć. Ktoś musiałby pilnować czystości.
    essence: Jedzenie trafia do ludzi, a nie do kosza.
    for_whom: >-
      Każdy, komu brakuje do pierwszego, i każdy, kto nie lubi marnować.
    reply_pl: null
  - id: PM33
    kind: dobra-praktyka
    stage: dziala
    target_groups: [dzieci-mlodziez-rodziny]
    author:
      display_name: Uczniowski Klub Sportowy
      is_organisation: true
    title: Sobotnie treningi bez opłat
    description: >-
      W soboty prowadzimy darmowe treningi piłki nożnej i lekkoatletyki.
      Ośrodek pomocy społecznej daje znać rodzinom, których nie stać na
      płatne zajęcia, a trenerzy pilnują, żeby nikt nie wiedział, kto skąd
      przyszedł. Stale przychodzi około trzydziestu dzieci.
    essence: Sport bez opłat i bez etykiet.
    for_whom: >-
      Dzieci i młodzież z rodzin, których nie stać na płatne zajęcia.
    reply_pl: null
  - id: PM34
    kind: pomysl
    stage: test
    target_groups: [niepelnosprawnosc-sensoryczna]
    author:
      display_name: Adam G.
      is_organisation: false
    title: Aplikacja, która czyta nazwy przystanków
    description: >-
      Jestem niewidomy i dojeżdżam do pracy autobusem, w którym nie ma
      zapowiedzi przystanków. Z kolegą zrobiliśmy aplikację, która czyta
      nazwę przystanku na podstawie lokalizacji telefonu. Testuje ją teraz
      kilka osób niewidomych i słabowidzących.
    essence: Niewidomy pasażer wie, gdzie wysiąść, bez pytania innych.
    for_whom: >-
      Osoby niewidome i słabowidzące, które same jeżdżą komunikacją.
    reply_pl: null
  - id: PM35
    kind: dobra-praktyka
    stage: dziala
    target_groups: [seniorzy]
    author:
      display_name: Rada Seniorów przy urzędzie gminy
      is_organisation: true
    title: Dyżur seniora w urzędzie
    description: >-
      W każdy wtorek dwie osoby z naszej rady dyżurują w holu urzędu i
      pomagają starszym mieszkańcom wypełnić wniosek albo znaleźć właściwy
      pokój. Najczęściej chodzi o dodatki, podatki i opłaty za śmieci. Urząd
      dał nam stolik i identyfikatory.
    essence: Senior pomaga seniorowi załatwić sprawę w urzędzie.
    for_whom: >-
      Starsi mieszkańcy, którzy rzadko bywają w urzędzie i boją się pytać.
    reply_pl: null
  - id: PM36
    kind: pomysl
    stage: prototyp
    target_groups: [spektrum-autyzmu, rynek-pracy]
    author:
      display_name: Fundacja wspierania osób w spektrum autyzmu
      is_organisation: true
    title: Staż w firmie z trenerem pracy
    description: >-
      Dorośli w spektrum często mają dobre wykształcenie, ale odpadają na
      rozmowie kwalifikacyjnej. Razem z dwiema miejscowymi firmami
      przygotowaliśmy staże, na których trener pracy przez pierwsze tygodnie
      towarzyszy stażyście i tłumaczy zespołowi, czego on potrzebuje.
    essence: >-
      Pracodawca i pracownik w spektrum mają kogoś, kto pomaga im się
      porozumieć.
    for_whom: Dorośli w spektrum autyzmu, którzy szukają pierwszej pracy.
    reply_pl: >-
      Dziękujemy. To dobry temat na test w kilku powiatach. Zapraszamy na
      konsultację z opiekunem kategorii rynek pracy.
  - id: PM37
    kind: pomysl
    stage: pomysl
    target_groups: [dzieci-mlodziez-rodziny]
    author:
      display_name: Joanna P.
      is_organisation: false
    title: Wieczór dla rodziców nastolatków
    description: >-
      Mam dwoje nastolatków i czasem nie wiem, jak z nimi rozmawiać. Myślę,
      że inni rodzice mają to samo. Szkoła mogłaby raz w miesiącu robić
      wieczór, na którym rodzice rozmawiają ze sobą i z pedagogiem, bez ocen
      i bez wywiadówki.
    essence: >-
      Rodzice uczą się od siebie nawzajem, jak rozmawiać z dorastającymi
      dziećmi.
    for_whom: Rodzice dzieci w wieku od dwunastu do osiemnastu lat.
    reply_pl: null
  - id: PM38
    kind: dobra-praktyka
    stage: test
    target_groups: [cudzoziemcy, dzieci-mlodziez-rodziny]
    author:
      display_name: Szkoła Podstawowa
      is_organisation: true
    title: Asystentka międzykulturowa w klasie
    description: >-
      W naszej szkole uczy się kilkanaścioro dzieci z Ukrainy i jedno z
      Gruzji. Zatrudniliśmy na część etatu asystentkę, która mówi po
      ukraińsku, pomaga na lekcjach i rozmawia z rodzicami. Sprawdzamy, czy
      dzieci szybciej nadrabiają zaległości.
    essence: W szkole jest ktoś, kto rozumie język dziecka i jego rodziców.
    for_whom: Uczniowie z innych krajów i ich rodzice.
    reply_pl: null
  - id: PM39
    kind: pomysl
    stage: pomysl
    target_groups: [zdrowie, seniorzy]
    author:
      display_name: Henryk M.
      is_organisation: false
    title: Pomiar ciśnienia przy sklepie
    description: >-
      Do przychodni mamy daleko, a do sklepu chodzi każdy. Raz w tygodniu
      pielęgniarka mogłaby mierzyć przy sklepie ciśnienie i cukier i
      doradzić, kiedy iść do lekarza.
    essence: Badanie tam, gdzie ludzie i tak przychodzą.
    for_whom: >-
      Mieszkańcy wsi, zwłaszcza starsi mężczyźni, którzy nie chodzą do
      lekarza.
    reply_pl: null
  - id: PM40
    kind: pomysl
    stage: prototyp
    target_groups: [dzieci-mlodziez-rodziny]
    author:
      display_name: Młodzieżowa Rada Gminy
      is_organisation: true
    title: Pokój młodzieży w remizie
    description: >-
      Młodzież nie ma gdzie się spotykać, więc siedzi na przystanku.
      Dostaliśmy od strażaków jeden pokój w remizie, sami go pomalowaliśmy i
      urządziliśmy. Otwieramy go dwa razy w tygodniu pod opieką wolontariusza
      i sprawdzamy, kto przychodzi i czego potrzebuje.
    essence: Młodzi sami tworzą i prowadzą swoje miejsce.
    for_whom: >-
      Nastolatki ze wsi, które nie mają gdzie spędzać czasu po szkole.
    reply_pl: >-
      Dziękujemy. Podobną potrzebę zgłaszają inne gminy. Zapraszamy na
      konsultację o finansowaniu opiekuna na kolejne miesiące.
  - id: PM41
    kind: pomysl
    stage: pomysl
    target_groups: [niepelnosprawnosc-intelektualna]
    author:
      display_name: Dorota F.
      is_organisation: false
    title: Wakacje dla dorosłych z niepełnosprawnością
    description: >-
      Pracuję jako opiekunka. Dorośli z niepełnosprawnością intelektualną
      prawie nigdy nie wyjeżdżają, bo ich rodzice są już starzy i zmęczeni.
      Chciałabym zorganizować krótki wyjazd z wolontariuszami, żeby oni
      mieli wakacje, a rodzice chwilę odpoczęli.
    essence: >-
      Wyjazd dla dorosłych z niepełnosprawnością i odpoczynek dla ich
      rodziców.
    for_whom: >-
      Dorośli z niepełnosprawnością intelektualną i ich starsi rodzice.
    reply_pl: null
  - id: PM42
    kind: dobra-praktyka
    stage: dziala
    target_groups: [seniorzy, dzieci-mlodziez-rodziny]
    author:
      display_name: Uniwersytet Trzeciego Wieku
      is_organisation: true
    title: Seniorzy czytają w przedszkolu
    description: >-
      Kilkoro naszych słuchaczy raz w tygodniu czyta bajki w przedszkolu i
      pomaga przy zajęciach plastycznych. Przedszkole jest zadowolone, a
      nasi wolontariusze mówią, że to najlepszy dzień tygodnia. Działa to
      już trzeci rok.
    essence: Seniorzy są potrzebni, a dzieci mają dodatkowych dziadków.
    for_whom: >-
      Aktywni seniorzy, którzy chcą coś robić dla innych, i przedszkolaki.
    reply_pl: null
  - id: PM43
    kind: pomysl
    stage: test
    target_groups: [bezdomnosc, zdrowie]
    author:
      display_name: Fundacja pomocy osobom w kryzysie bezdomności
      is_organisation: true
    title: Pielęgniarka w łaźni
    description: >-
      Osoby w kryzysie bezdomności przychodzą do naszej łaźni, ale do
      przychodni już nie. Testujemy dyżur pielęgniarki raz w tygodniu:
      opatrunki, pomiary, rozmowa o leczeniu. Już widać, że ludzie
      przychodzą z ranami, z którymi nie poszliby nigdzie indziej.
    essence: >-
      Opieka zdrowotna tam, gdzie osoba w kryzysie bezdomności i tak
      przychodzi.
    for_whom: Osoby w kryzysie bezdomności, które unikają przychodni.
    reply_pl: null
  - id: PM44
    kind: pomysl
    stage: prototyp
    target_groups: [ograniczona-mobilnosc, seniorzy]
    author:
      display_name: Urząd Gminy
      is_organisation: true
    title: Pomoc na schodach w blokach bez wind
    description: >-
      W naszych blokach bez wind mieszka wielu starszych ludzi, którzy od
      miesięcy nie zeszli na dół. Kupiliśmy jeden schodołaz i przeszkoliliśmy
      dwóch pracowników, którzy na zgłoszenie pomagają zejść i wejść, na
      przykład do lekarza albo na spacer. Sprawdzamy, ile jest zgłoszeń i
      czy dwie osoby wystarczą.
    essence: >-
      Osoba, która nie pokona sama schodów, znowu wychodzi z domu.
    for_whom: >-
      Seniorzy i osoby z niepełnosprawnością ruchową, które mieszkają na
      wyższych piętrach.
    reply_pl: >-
      Dziękujemy. Rozwiązania z podobnym sprzętem pokazujemy na stronie
      trasy. Opiekun kategorii wskaże programy, z których można sfinansować
      drugi schodołaz.
  - id: PM45
    kind: pomysl
    stage: prototyp
    target_groups: [inne, seniorzy]
    author:
      display_name: Łukasz T.
      is_organisation: false
    title: Tablica sąsiedzkiej pomocy
    description: >-
      Na klatce schodowej powiesiłem korkową tablicę: kto czegoś potrzebuje,
      przypina kartkę, a kto może pomóc, dopisuje się. W kilka tygodni
      pojawiło się sporo próśb o wyniesienie śmieci, zakupy i korepetycje.
      Chcę to rozszerzyć na całe osiedle.
    essence: >-
      Sąsiedzi widzą, kto potrzebuje drobnej pomocy, i mogą jej udzielić.
    for_whom: Mieszkańcy bloku, szczególnie starsi i samotni.
    reply_pl: null
  - id: PM46
    kind: pomysl
    stage: prototyp
    target_groups: [dzieci-mlodziez-rodziny]
    author:
      display_name: Stowarzyszenie Rodzin Aktywnych
      is_organisation: true
    title: Rodzinne popołudnia z grami planszowymi w bibliotece
    description: >-
      Raz w tygodniu biblioteka gminna otwiera salę z grami planszowymi dla
      rodzin. Wolontariusze tłumaczą zasady, a rodzice grają razem z dziećmi
      zamiast spędzać popołudnie przed ekranem.
    essence: >-
      Wspólna gra daje rodzinom czas bez telefonów i miejsce, gdzie poznają
      inne rodziny z gminy.
    for_whom: Rodziny z dziećmi w wieku szkolnym, szczególnie nowi mieszkańcy gminy.
    reply_pl: null
