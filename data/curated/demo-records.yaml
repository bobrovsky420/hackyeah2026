          możemy dostać na to pieniądze z gminy, skoro nie jesteśmy
          stowarzyszeniem?
      - author: rops
        text: >-
          Dziękujemy za pytanie. Koło wpisane do rejestru kół gospodyń
          wiejskich może samo składać wnioski. Najprościej zacząć od
          rozmowy w urzędzie gminy o małych grantach albo o funduszu
