# The texts of the simulated pilot's records in the ROPS panel: the
# demonstration data of module II and the queues of module VI (idea cards,
# contact requests, readiness registrations, mentors, partnership posts,
# conversations, content reports and declined inputs). Hand-written
# reference data, committed to git.
#
# The texts are authored examples in everyday voices; they quote nobody and
# name no real person or organisation. A person is a first name and the
# initial of the surname, an organisation a generic type. The texts hold no
# contact data, dates or place names: the generator of the demonstration
# data adds its own ids, dates, places, statuses and contact data. The ids
# below only link the records of this file (a thread to its mentor or its
# post). Target groups are the codes of data/curated/taxonomies.json.
#
# Fields:
# - ideas: idea cards of module III ("Kreator pomysłów"). kind (pomysl, or
#   dobra-praktyka for a practice already tried), stage (pomysl, prototyp,
#   test, dziala), target_groups, author (display_name, is_organisation),
#   title, description ("Krótki opis pomysłu"), essence ("Co jest jego
#   istotą"), for_whom ("Komu jest dedykowany", in the author's words),
#   reply_pl (ROPS's answer to the author, or null); canvas (optional) for
#   a card sent as a CANVAS application: answers (the codes and texts of
#   src/lib/canvas.ts, without the card's own fields) and partners.
# - contacts: requests "Poproś o kontakt" sent from a route. target
#   (innovation or advisor), group (for an advisor the category asked
#   about, for an innovation the group the asker works with), requester
#   (name, organisation or null for a resident), message (fits any
#   innovation of the group and names none).
# - readiness: registrations "Gotowość do testów" of organisations.
#   display_name, topics.
# - mentors: experts beside the two of src/server/db/examples.ts. name (a
#   role, not a person), expertise_pl, target_groups.
# - posts: the partnership board. kind (szukam or oferuje), sector,
#   seeking, target_groups, author (display_name, organisation or null),
#   title, description.
# - threads: conversations of module V. topic (pytanie, mentor,
#   partnerstwo), subject, author (display_name, organisation or null,
#   sector), target_groups, mentor (a mentor id for topic mentor, else
#   null), post (a post id for topic partnerstwo, else null), messages
#   (author: uzytkownik, rops or mentor; text). A thread whose last message
#   is the user's waits for ROPS.
# - reports: "Zgłoś problem z tą treścią". target (route, innovation or
#   need), reason (nieprawdziwe, obrazliwe, dane_osobowe, inne), comment
#   (or null).
# - declined: texts sent to the question form that the gate declines or
#   treats as off-topic. kind (spam, rude, test, harm), text. The link-like
#   phrases are invented and lead nowhere.
# - moderation_reasons_pl: reasons ROPS gives when it rejects or holds an
#   entry.
# - notes_pl: internal notes of ROPS staff on entries.
# - evaluations: evaluations of catalogue innovations in module IV ("Tester
#   innowacji"). innovation_id (an id of data/built/innovations), rating (1
#   to 5, or null), experience (korzystam, wdrazam, opis, or null), feedback
#   and improvement (or null), test_signup (as: uzytkownik or wdrazajacy, or
#   null), author (display_name, or null when anonymous; a test sign-up
#   always has one).
version: "2026-10-03"

ideas:
  - id: PM01
    kind: pomysl
    stage: pomysl
    target_groups: [seniorzy]
    author:
      display_name: Halina S.
      is_organisation: false
    title: Telefon do sąsiada w każdy poniedziałek
    description: >-
      Sąsiedzi z jednej ulicy dzwonią raz w tygodniu do starszych osób,
      które mieszkają same. Krótka rozmowa, pytanie, czy czegoś nie trzeba.
      Listę chętnych do dzwonienia można trzymać w świetlicy albo w parafii.
    essence: >-
      Regularny telefon daje poczucie, że ktoś pamięta, i pozwala szybko
      zauważyć, że dzieje się coś złego.
    for_whom: >-
      Dla starszych ludzi, którzy mieszkają sami i rzadko wychodzą, tak jak
      moja mama.
    reply_pl: null
  - id: PM02
    kind: dobra-praktyka
    stage: dziala
    target_groups: [seniorzy, zdrowie]
    author:
      display_name: Klub Seniora przy świetlicy wiejskiej
      is_organisation: true
    title: Gimnastyka na krzesłach w świetlicy
    description: >-
      Od dwóch lat dwa razy w tygodniu prowadzimy ćwiczenia na krzesłach dla
      seniorów. Prowadzi je emerytowana nauczycielka wychowania fizycznego
      po krótkim kursie. Przychodzi kilkanaście osób, także po udarze i z
      chorymi kolanami.
    essence: Proste ćwiczenia w grupie, blisko domu, bez sprzętu i bez opłat.
    for_whom: >-
      Seniorzy z naszej wsi, także ci, którzy mają kłopot z chodzeniem.
    reply_pl: null
  - id: PM03
    kind: pomysl
    stage: pomysl
    target_groups: [dzieci-mlodziez-rodziny]
    author:
      display_name: Katarzyna M.
      is_organisation: false
    title: Wymiana ubranek dla dzieci
    description: >-
      Dzieci szybko wyrastają z ubrań i butów, a wielu rodzin nie stać na
      ciągłe kupowanie nowych. Chciałabym raz w miesiącu zrobić w szkole
      wymianę: przynosisz, co masz, bierzesz, czego potrzebujesz. Bez
      pieniędzy i bez wstydu.
    essence: Rzeczy krążą między rodzinami, zamiast leżeć w szafach.
    for_whom: >-
      Rodzice małych dzieci, zwłaszcza samotne mamy i rodziny wielodzietne.
    reply_pl: null
  - id: PM04
    kind: pomysl
    stage: prototyp
    target_groups: [dzieci-mlodziez-rodziny]
    author:
      display_name: Szkoła Podstawowa
      is_organisation: true
    title: Świetlica otwarta do wieczora
    description: >-
      Wielu rodziców wraca z pracy późno, a świetlica szkolna zamyka się po
      południu. Przez jeden semestr dwa razy w tygodniu przedłużamy jej
      pracę, a studenci odrabiają z dziećmi lekcje. Szukamy sposobu, żeby
      utrzymać to na stałe.
    essence: >-
      Dzieci mają bezpieczne miejsce i pomoc w nauce, a rodzice mogą
      spokojnie pracować.
    for_whom: Uczniowie młodszych klas, których rodzice dojeżdżają do pracy.
    reply_pl: >-
      Dziękujemy za fiszkę. Pomysł pasuje do tematu najbliższego naboru
      inkubatora na działania dla dzieci i rodzin. Prosimy przygotować
      krótkie zestawienie kosztów pilotażu, omówimy je na konsultacji.
  - id: PM05
    kind: dobra-praktyka
    stage: dziala
    target_groups: [niepelnosprawnosc-intelektualna, rynek-pracy]
    author:
      display_name: Środowiskowy Dom Samopomocy
      is_organisation: true
    title: Kawiarenka prowadzona przez uczestników
    description: >-
      Raz w tygodniu nasi uczestnicy prowadzą małą kawiarenkę w budynku
      ośrodka. Sami pieką ciasto, obsługują gości i liczą utarg. Przychodzą
      mieszkańcy, rodziny, czasem urzędnicy z gminy.
    essence: >-
      Prawdziwa praca z gośćmi uczy samodzielności lepiej niż ćwiczenia na
      zajęciach.
    for_whom: >-
      Dorośli z niepełnosprawnością intelektualną, którzy chcą spróbować
      pracy.
    reply_pl: >-
      Dziękujemy za opis praktyki. Chcielibyśmy pokazać ją w bazie jako
      dobrą praktykę i zapraszamy na krótką rozmowę z opiekunem kategorii.
  - id: PM06
    kind: pomysl
    stage: pomysl
    target_groups: [ograniczona-mobilnosc, seniorzy]
    author:
      display_name: Józef P.
      is_organisation: false
    title: Bus na zakupy dla starszych
    description: >-
      U nas autobus jeździ dwa razy dziennie i nie staje przy sklepie.
      Starsi, którzy nie mają samochodu, proszą sąsiadów albo nie wychodzą
      wcale. Gminny bus mógłby raz w tygodniu jechać do sklepu i do
      przychodni.
    essence: >-
      Jeden stały kurs w tygodniu, żeby starsi mogli sami zrobić zakupy i
      pójść do lekarza.
    for_whom: >-
      Dla starszych i chorych z przysiółków, którzy nie mają jak dojechać.
    reply_pl: >-
      Dziękujemy. W katalogu są usługi transportu na żądanie dla osób z
      ograniczoną mobilnością, pokazujemy je na stronie trasy. Proponujemy
      rozmowę z gminą o połączeniu pomysłu z przewozem, który już działa.
