        through: [szkola, organizacja]
        extra: [wydarzenia-lokalne]
        impact_person: wyrazny
        impact_community: mozliwy
        impact_environment: maly
      partners:
        - name: Biblioteka Gminna
          roles: [koszty, wartosc]
          status: potwierdzony
        - name: Szkoła Podstawowa
          roles: [zasieg]
          status: rozmowy

contacts:
  - id: KT01
    target: innovation
    group: seniorzy
    requester:
      name: Małgorzata K.
      organisation: Ośrodek Pomocy Społecznej
    message: >-
      Chcielibyśmy wdrożyć to rozwiązanie w naszej gminie, mamy sporo
      samotnych seniorów w małych wsiach. Czy są materiały dla koordynatora
      i wzór regulaminu? Chętnie porozmawiamy też o kosztach pierwszego
      roku.
  - id: KT02
    target: innovation
    group: seniorzy
    requester:
      name: Ryszard B.
      organisation: null
    message: >-
      Moja mama mieszka sama i myślę, że to by jej pomogło. Czy można to
      zorganizować u nas we wsi, czy trzeba to zgłosić w gminie? Nie wiem,
      od czego zacząć.
  - id: KT03
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Iwona S.
      organisation: Szkoła Podstawowa
    message: >-
      Jestem pedagogiem szkolnym. Chciałabym zapytać, jak wyglądały pierwsze
      tygodnie wdrożenia w szkole i ile osób potrzeba do prowadzenia zajęć.
      Czy można przyjechać i zobaczyć, jak to działa na miejscu?
  - id: KT04
    target: innovation
    group: seniorzy
    requester:
      name: Wiesław N.
      organisation: Klub Seniora przy świetlicy wiejskiej
    message: >-
      Jesteśmy małym klubem seniora i działamy bez etatów. Czy to
      rozwiązanie da się prowadzić siłami wolontariuszy? Prosimy o krótką
      rozmowę telefoniczną.
  - id: KT05
    target: innovation
    group: ograniczona-mobilnosc
    requester:
      name: Elżbieta W.
      organisation: Urząd Gminy
    message: >-
      Gmina planuje usługę dla osób, które mają trudność z wyjściem z domu.
      Interesuje nas, jak rozwiązaliście zamawianie usługi i ile to kosztuje
      miesięcznie. Czy są dokumenty, które możemy wykorzystać?
  - id: KT06
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Marta L.
      organisation: Fundacja wsparcia rodzin
    message: >-
      Pracujemy z rodzinami, które mają kłopoty wychowawcze. Chcielibyśmy
      skorzystać z waszych doświadczeń w naszym projekcie. Czy możemy umówić
      się na rozmowę online?
  - id: KT07
    target: innovation
    group: niepelnosprawnosc-intelektualna
    requester:
      name: Teresa D.
      organisation: null
    message: >-
      Mam dorosłą córkę z niepełnosprawnością intelektualną i szukam czegoś
      takiego w okolicy. Czy to działa tylko u was, czy można to założyć
      gdzie indziej?
  - id: KT08
    target: innovation
    group: zdrowie
    requester:
      name: Andrzej P.
      organisation: Stowarzyszenie promocji zdrowia
    message: >-
      Chcemy przenieść to rozwiązanie na nasz teren. Prosimy o informację,
      czy potrzebna jest współpraca z przychodnią i jakie były największe
      trudności na początku.
  - id: KT09
    target: innovation
    group: cudzoziemcy
    requester:
      name: Natalia H.
      organisation: Fundacja na rzecz cudzoziemców
    message: >-
      W naszym powiecie mieszka coraz więcej rodzin z zagranicy i to
      rozwiązanie bardzo nas zainteresowało. Czy macie materiały w innych
      językach i czy możemy z nich korzystać?
  - id: KT10
    target: innovation
    group: seniorzy
    requester:
      name: Bożena A.
      organisation: Ośrodek Pomocy Społecznej
    message: >-
      Dzień dobry, jestem pracownikiem socjalnym. Kierownik poprosił, żebym
      dowiedziała się więcej o tym rozwiązaniu, zanim zaplanujemy budżet.
      Ile osób obsługuje jeden koordynator i skąd były pieniądze na start?
  - id: KT11
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Piotr Z.
      organisation: Urząd Gminy
    message: >-
      Rozważamy wprowadzenie podobnych zajęć w trzech szkołach gminy. Czy
      można dostać scenariusze zajęć i informację, jakich kwalifikacji
      wymaga prowadzący? Chętnie zaprosimy kogoś od was na spotkanie z
      dyrektorami.
  - id: KT12
    target: innovation
    group: niepelnosprawnosc-sensoryczna
    requester:
      name: Jolanta M.
      organisation: Stowarzyszenie na rzecz osób z niepełnosprawnościami
    message: >-
      Wśród naszych członków jest kilkanaście osób niewidomych i
      słabowidzących. Chcielibyśmy sprawdzić to rozwiązanie u nas. Ile
      kosztuje sprzęt i czy prowadzicie szkolenia?
  - id: KT13
    target: innovation
    group: seniorzy
    requester:
      name: Zofia R.
      organisation: null
    message: >-
      Jestem emerytką i mam trochę czasu. Chętnie pomogłabym przy czymś
      takim w swojej okolicy. Do kogo mam się zgłosić?
  - id: KT14
    target: innovation
    group: rynek-pracy
    requester:
      name: Mariusz C.
      organisation: Spółdzielnia socjalna
    message: >-
      Zatrudniamy osoby, które długo były bez pracy, i szukamy sprawdzonych
      sposobów na pierwsze miesiące zatrudnienia. Czy moglibyśmy
      porozmawiać o tym, jak to u was wygląda w praktyce?
  - id: KT15
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Anna W.
      organisation: null
    message: >-
      Jestem mamą trójki dzieci i bardzo chciałabym, żeby coś takiego było
      w naszej szkole. Jak mogę to zaproponować dyrekcji? Czy macie ulotkę,
      którą mogę pokazać?
  - id: KT16
    target: innovation
    group: spektrum-autyzmu
    requester:
      name: Kamila O.
      organisation: Przedszkole samorządowe
    message: >-
      W naszym przedszkolu jest kilkoro dzieci w spektrum autyzmu. Szukamy
      sprawdzonych sposobów pracy w grupie. Czy możecie przeszkolić nasze
      nauczycielki albo polecić materiały?
  - id: KT17
    target: innovation
    group: seniorzy
    requester:
      name: Edward J.
      organisation: Urząd Gminy
    message: >-
      Gmina przygotowuje program działań dla seniorów na kolejne lata i
      chcemy wpisać do niego to rozwiązanie. Prosimy o kontakt z osobą,
      która opowie o kosztach i efektach.
  - id: KT18
    target: innovation
    group: bezdomnosc
    requester:
      name: Robert F.
      organisation: Stowarzyszenie pomocy osobom w kryzysie bezdomności
    message: >-
      Prowadzimy noclegownię i szukamy sposobów, żeby nasi mieszkańcy
      szybciej się usamodzielniali. Bardzo interesuje nas wasze
      doświadczenie. Czy możemy przyjechać na wizytę studyjną?
  - id: KT19
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Ewelina G.
      organisation: Ośrodek Pomocy Społecznej
    message: >-
      Jestem asystentką rodziny i pracuję z kilkoma rodzinami, którym to by
      pomogło. Czy rodzina może zgłosić się sama, czy potrzebne jest
      skierowanie?
  - id: KT20
    target: innovation
    group: ograniczona-mobilnosc
    requester:
      name: Leszek K.
      organisation: null
    message: >-
      Od wypadku poruszam się na wózku. Przeczytałem o tym rozwiązaniu i
      chciałbym wiedzieć, czy działa też w mniejszych miejscowościach. Kto
      mógłby to u nas uruchomić?
  - id: KT21
    target: innovation
    group: zdrowie
    requester:
      name: Grażyna T.
      organisation: Koło Gospodyń Wiejskich
    message: >-
      Wiele kobiet z naszego koła opiekuje się chorymi w domu. Chcielibyśmy
      zorganizować u nas coś podobnego. Czy są materiały dla osób, które
      prowadzą spotkania?
  - id: KT22
    target: innovation
    group: seniorzy
    requester:
      name: Dariusz S.
      organisation: Fundacja wsparcia seniorów
    message: >-
      Prowadzimy kilka klubów seniora w powiecie i chcielibyśmy dodać to do
      naszych zajęć. Na jakich warunkach można korzystać z materiałów? Czy
      trzeba podpisać jakąś umowę?
  - id: KT23
    target: innovation
    group: niepelnosprawnosc-intelektualna
    requester:
      name: Urszula B.
      organisation: Środowiskowy Dom Samopomocy
    message: >-
      Nasi uczestnicy mogliby skorzystać z takiego rozwiązania. Zanim
      zgłosimy pomysł do gminy, chcemy wiedzieć, jak długo trwało
      przygotowanie i kto był partnerem. Prosimy o kontakt.
  - id: KT24
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Sylwia K.
      organisation: Gminna Biblioteka Publiczna
    message: >-
      Biblioteka chce poszerzyć ofertę dla rodzin z małymi dziećmi. Czy to
      rozwiązanie można prowadzić w bibliotece? Prosimy o przykładowy plan
      spotkań.
  - id: KT25
    target: innovation
    group: cudzoziemcy
    requester:
      name: Oksana P.
      organisation: null
    message: >-
      Mieszkam w Polsce od niedawna i pracuję w szkole jako pomoc
      nauczyciela. Chciałabym, żeby coś takiego było też u nas. Czy mogę
      dostać więcej informacji po polsku albo po ukraińsku?
  - id: KT26
    target: innovation
    group: niepelnosprawnosc-sensoryczna
    requester:
      name: Marek K.
      organisation: Urząd Gminy
    message: >-
      Gmina chce poprawić dostępność usług dla osób głuchych i niewidomych.
      Czy wasze rozwiązanie można wdrożyć w małym urzędzie i ile kosztuje
      rocznie?
  - id: KT27
    target: innovation
    group: rynek-pracy
    requester:
      name: Beata R.
      organisation: Powiatowe Centrum Pomocy Rodzinie
    message: >-
      Szukamy sposobów aktywizacji zawodowej osób z niepełnosprawnościami.
      Czy to rozwiązanie przeniesiono już do innego powiatu? Chętnie
      porozmawiamy o współpracy.
  - id: KT28
    target: innovation
    group: seniorzy
    requester:
      name: Halina G.
      organisation: null
    message: >-
      Prowadzę nieformalną grupę sąsiadek, spotykamy się co tydzień. Czy do
      tego trzeba mieć stowarzyszenie, czy możemy zacząć same? Proszę o
      kilka rad na początek.
  - id: KT29
    target: innovation
    group: inne
    requester:
      name: Tadeusz W.
      organisation: Stowarzyszenie rozwoju wsi
    message: >-
      Szukamy pomysłów, które zbliżą mieszkańców naszej wsi, i wasze
      rozwiązanie bardzo nam się podoba. Czy da się je zrobić bez dużych
      pieniędzy i kto u was był liderem?
  - id: KT30
    target: innovation
    group: dzieci-mlodziez-rodziny
    requester:
      name: Agata M.
      organisation: Szkoła Podstawowa
    message: >-
      Jestem dyrektorką małej wiejskiej szkoły. Mamy salę i chętnych
      nauczycieli, brakuje nam pomysłu na zajęcia popołudniowe. Czy możemy
      dostać opis, jak to zorganizować krok po kroku?
  - id: KT31
    target: advisor
    group: seniorzy
    requester:
      name: Krystyna L.
      organisation: Ośrodek Pomocy Społecznej
    message: >-
      Prosimy o kontakt opiekuna kategorii. Szukamy wsparcia dla seniorów z
      demencją, którzy mieszkają sami, i nie znaleźliśmy w katalogu nic, co
      pasuje do małej gminy. Chętnie opiszemy naszą sytuację na spotkaniu.
  - id: KT32
    target: advisor
    group: dzieci-mlodziez-rodziny
    requester:
      name: Rafał N.
      organisation: Urząd Gminy
    message: >-
      Chcemy przygotować wniosek na działania dla rodzin z dziećmi i nie
      wiemy, który nabór wybrać. Prosimy o rozmowę z doradcą o możliwych
      źródłach finansowania.
  - id: KT33
    target: advisor
    group: niepelnosprawnosc-intelektualna
    requester:
      name: Danuta P.
      organisation: null
    message: >-
      Jestem mamą dorosłego syna z niepełnosprawnością intelektualną.
      Odkąd zostałam sama, nie wiem, kto w gminie może nam pomóc w
      codziennej opiece. Proszę o rozmowę z kimś, kto zna te sprawy.
  - id: KT34
    target: advisor
    group: cudzoziemcy
    requester:
      name: Ludmiła S.
      organisation: Szkoła Podstawowa
    message: >-
      Do naszej szkoły zapisało się kilkoro dzieci z zagranicy, które nie
      mówią po polsku. Prosimy doradcę o wskazanie, gdzie szukać wsparcia
      dla szkoły i dla rodziców.
  - id: KT35
    target: advisor
    group: bezdomnosc
    requester:
      name: Jan K.
      organisation: Ośrodek Pomocy Społecznej
    message: >-
      W naszej gminie nie ma noclegowni, a zimą mamy kilka osób w kryzysie
      bezdomności. Chcielibyśmy porozmawiać z doradcą o rozwiązaniach dla
      małych gmin, których nie stać na własną placówkę.
  - id: KT36
    target: advisor
    group: rynek-pracy
    requester:
      name: Magdalena Z.
      organisation: Centrum Integracji Społecznej
    message: >-
      Prosimy o konsultację w sprawie współpracy z lokalnymi firmami.
      Chcemy, żeby nasi uczestnicy po kursach mieli gdzie odbyć praktyki, i
      szukamy sprawdzonych modeli.
  - id: KT37
    target: advisor
    group: zdrowie
    requester:
      name: Stefan O.
      organisation: Urząd Gminy
    message: >-
      Gmina chce zająć się zdrowiem psychicznym młodzieży, ale w okolicy nie
      ma psychologa dziecięcego. Prosimy o kontakt z doradcą, który podpowie,
      od czego zacząć i z kim współpracować.
  - id: KT38
    target: advisor
    group: seniorzy
    requester:
      name: Irena C.
      organisation: null
    message: >-
      Jestem w radzie seniorów i chcemy przekonać wójta do otwarcia klubu
      seniora. Prosimy o rozmowę o tym, jakie argumenty i dane pokazać na
      sesji rady gminy.
  - id: KT39
    target: advisor
    group: dzieci-mlodziez-rodziny
    requester:
      name: Patrycja W.
      organisation: Fundacja wsparcia rodzin
    message: >-
      Mamy pomysł na wsparcie rodzin zastępczych w powiecie, ale nie wiemy,
      czy coś podobnego działa już w regionie. Prosimy o kontakt z doradcą
      kategorii.
  - id: KT40
    target: advisor
    group: spektrum-autyzmu
    requester:
      name: Hubert D.
      organisation: Stowarzyszenie rodziców dzieci w spektrum autyzmu
    message: >-
      Szukamy wsparcia przy planowaniu zajęć dla nastolatków w spektrum,
      którzy kończą szkołę. Prosimy doradcę o rozmowę, czy w regionie są
      partnerzy, z którymi warto się połączyć.

