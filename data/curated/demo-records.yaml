      display_name: Katarzyna M.
      organisation: null
      sector: mieszkaniec
    target_groups: [dzieci-mlodziez-rodziny]
    mentor: null
    post: null
    messages:
      - author: uzytkownik
        text: >-
          Wysłałam fiszkę z pomysłem wymiany ubranek dla dzieci. Nie należę
          do żadnej organizacji. Czy to przeszkoda?
      - author: rops
        text: >-
          Nie, fiszkę może wysłać każdy mieszkaniec. Jeśli pomysł trafi do
          naboru, pomożemy znaleźć organizację, która zostanie partnerem i
          zajmie się formalnościami.
  - id: RZ05
    topic: mentor
    subject: Jak utrzymać wolontariuszki przy młodych rodzinach?
    author:
      display_name: Ewelina G.
      organisation: Ośrodek Pomocy Społecznej
      sector: instytucja
    target_groups: [dzieci-mlodziez-rodziny]
    mentor: MT01
    post: null
    messages:
      - author: uzytkownik
        text: >-
          Chcemy połączyć młode mamy z doświadczonymi sąsiadkami, które będą
          je odwiedzać. Boimy się, że wolontariuszki szybko się zniechęcą.
          Jak tego uniknąć?
      - author: rops
        text: >-
          Dziękujemy. Do rozmowy dołącza ekspertka, która zna podobne
          programy.
      - author: mentor
        text: >-
          Najważniejsze są regularne spotkania wolontariuszek z
          koordynatorką, raz w miesiącu, i jasna umowa, ile czasu każda z
          nich daje. Dobrze też zacząć od kilku par, a nie od całej gminy.
      - author: uzytkownik
        text: >-
          Dziękujemy, to bardzo pomocne. Czy ma Pani wzór takiej umowy z
          wolontariuszką?
