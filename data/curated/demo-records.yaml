      Jestem z Ukrainy i mieszkam tu z dwójką dzieci. Dzieci szybko uczą się
      polskiego w szkole, ale mamy siedzą w domu i boją się mówić.
      Chciałabym spotkań raz w tygodniu, na których rozmawiamy po polsku
