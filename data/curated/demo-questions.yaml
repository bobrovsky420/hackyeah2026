# The question bank of the simulated pilot in the ROPS panel: the questions
# behind the demonstration data of the trends (module II), each run once
# through the route pipeline. Hand-written reference data, committed to git.
#
# Source: two sets of test questions in Polish prepared by the team, 180 on
# the nine ROPS categories (20 per category, covering all 115 ROPS items of
# the catalogue) and 50 on matters outside the catalogue. The questions are
# authored examples, not quotes of users, and confirm no service. The place
# names and events of the second set build test scenarios only; nobody
# verified the renovations, plans or complaints they mention.
#
# Fields:
# - id: the id of the source set (EMPP01 ... FAMP20, X01 ... X50).
# - scope: catalogue (written for named ROPS items), partial (shares a topic
#   or a target group with a category, which does not mean the catalogue
#   solves it) or outside (beyond the catalogue).
# - category: the target-group code of the question's ROPS category
#   (data/curated/taxonomies.json); catalogue questions only.
# - expected: the innovation ids of the ROPS items the question was written
#   for, matched by their ROPS page; candidates to check, not a closed list
#   of right answers.
# - related: the target-group codes a partial question touches; empty when
#   outside.
# - topic_pl: the short topic of the source set (for scope outside and
#   partial, its theme section).
# - role: added by the team, read from the voice of the text (who writes:
#   a resident or relative, an institution's worker, a social organisation
#   or a gmina office).
# - place_terc: added by the team. A place the text names (Kraków for the
#   Korona pool, Podgórze, Krzemionki and a district; a gmina on the Raba)
#   is kept; otherwise the gmina was drawn once, weighted by its population
#   (GUS BDL, variable 72305, 2024), among the gminas the text implies: the
#   three cities (Kraków, Tarnów, Nowy Sącz) for street homelessness, city
#   transport and big hospitals, urban gminas for blocks of flats, rural and
#   urban-rural gminas for villages, and all gminas otherwise.
# - text_pl: the question as the source set has it, word for word.
