    hours_pl: całą dobę, 7 dni w tygodniu
    who_for_pl: Dla osób doznających przemocy domowej i dla świadków przemocy.
    free: true
    url: https://niebieskalinia.info/
    source_url: https://niebieskalinia.info/
    verified_on: "2026-10-03"

  - id: hl-800702222
    order: 5
    group: support
    name_pl: Centrum Wsparcia dla osób w kryzysie psychicznym
    number: "800 702 222"
    hours_pl: całą dobę, 7 dni w tygodniu
