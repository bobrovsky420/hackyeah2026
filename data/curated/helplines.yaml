  # to Thursday and 12:00-15:00 on Friday.
  - id: hl-800100100
    order: 7
    group: support
    name_pl: Telefon dla rodziców i nauczycieli w sprawie bezpieczeństwa dzieci 800 100 100 (Fundacja Dajemy Dzieciom Siłę)
    number: "800 100 100"
    hours_pl: poniedziałek - czwartek 10:00-14:00, piątek 12:00-15:00
    who_for_pl: Dla dorosłych, w tym rodziców i nauczycieli, którzy martwią się o bezpieczeństwo dziecka poniżej 18 lat.
    free: true
    url: https://800100100.pl/
    source_url: https://800100100.pl/
    verified_on: "2026-10-03"
