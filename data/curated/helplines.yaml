  - id: hl-800121212
    order: 6
    group: support
    name_pl: Dziecięcy Telefon Zaufania Rzecznika Praw Dziecka
    number: "800 121 212"
    hours_pl: całą dobę, 7 dni w tygodniu
    who_for_pl: Dla dzieci i młodzieży, które potrzebują wsparcia lub chcą porozmawiać o swoich problemach.
    free: true
    url: https://brpd.gov.pl/telefon-zaufania-rzecznika-praw-dziecka-800-12-12-12/
    source_url: https://brpd.gov.pl/telefon-zaufania-rzecznika-praw-dziecka-800-12-12-12/
    verified_on: "2026-10-03"

  # Hours: the operator's duty schedule; the specification 12.6 and 116sos.pl
