# Seeded implementations (specification 8.6 and FR-6.3). Hand-written reference
# data, committed to git.
# Sources: the ROPS ranking lists of the "Usługa wrażliwa" grants (round I,
# results 31 March 2026; round II, results 24 August 2026; copies in
# .local/docs/rops/rops.krakow.pl/mpliki/IS/UW/) and the ROPS page
# "Innowacje w małopolskich modelach".
# The place of an implementation is the seat of the grantee. Where the ranking
# list names no place, the seat comes from the public register entry given in
# organisation.source_url. place_terc null means voivodeship-wide (a regional
# service model) or not yet established (see note_pl).
# Places of origin of the innovations (source catalogue-origin) are not listed
# here; they are derived from the built records by the pipeline.
